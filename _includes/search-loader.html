<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'content') {
          const query = document.getElementById('search-input').value.trim();
          const radius = 90;
          let excerpt = value;
          let matchIndex = -1;

          if (query !== '') {
            matchIndex = value.toLowerCase().indexOf(query.toLowerCase());
          }

          if (matchIndex === -1) {
            excerpt = value.slice(0, 2 * radius);
          } else {
            const start = Math.max(0, matchIndex - radius);
            const end = Math.min(value.length, matchIndex + query.length + radius);

            excerpt = (start > 0 ? '… ' : '') + value.slice(start, end) + (end < value.length ? ' …' : '');
          }

          excerpt = excerpt
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

          if (matchIndex !== -1) {
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const matchRegex = new RegExp(`(${escapedQuery})`, 'ig');

            excerpt = excerpt.replace(matchRegex, '<mark>$1</mark>');
          }

          return excerpt;
        }
      }
    });
  });
</script>
